<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Home CrossFit · 8 Wochen</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1fa;background:#0d1420}*{box-sizing:border-box}body{margin:0 auto;max-width:780px;padding:18px 16px 70px}h1{font-size:28px;margin:8px 0}h2{font-size:21px}h3{font-size:17px;margin-bottom:8px}p,li{line-height:1.55;color:#c9d4e4}.muted{color:#9babc0}.card{background:#172335;border:1px solid #314258;border-radius:15px;padding:17px;margin:15px 0}nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#0d1420;padding:12px 0;z-index:3}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #52647a;background:#263a53;color:white}button{cursor:pointer}button.active{background:#1672c7;border-color:#1672c7}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #34465a;padding:10px 0}.row:last-child{border:0}.small{font-size:13px;color:#aabbd0}.pill{display:inline-block;background:#2a425f;padding:5px 9px;border-radius:8px;font-size:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #34465a;font-size:14px}a{color:#80c5ff}input[type=checkbox]{width:20px;height:20px;accent-color:#27a777}.timer{font-size:44px;font-weight:750;font-variant-numeric:tabular-nums;text-align:center;padding:12px}section[hidden]{display:none} .exercise{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center} .photo{font-size:12px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid>div{background:#263a53;padding:12px;border-radius:10px;font-size:13px;text-align:center}@media(max-width:420px){h1{font-size:24px}.grid{grid-template-columns:1fr}}</style></head><body><div class="small">HOME GYM · 3 PERSONEN · 8 WOCHEN</div><h1>CrossFit Hybrid</h1><p>3 Trainingstage pro Woche · Muskelaufbau, Kraft und Fitness · 67 Minuten inklusive 10 Minuten Mobility.</p><nav><button class="active" onclick="tab('a',this)">Mo</button><button onclick="tab('b',this)">Mi</button><button onclick="tab('c',this)">Fr</button><button onclick="tab('weeks',this)">8 Wochen</button><button onclick="tab('mobility',this)">Mobility</button><button onclick="tab('log',this)">Log</button></nav><main id="content"></main><script>
const workouts={
a:{name:"Montag · Squat & Push",warm:"3 Min. lockeres Cardio, 10 Air Squats, 10 Band Pull-Aparts, 10 Hüftbeugen, Armkreise; danach steigende Aufwärmsätze.",main:[["Back Squat (Langhantel)","4 × 5–6","2–3 Min.","barbell back squat"],["Langhantel-Bankdrücken","3 × 6–10","2 Min.","barbell bench press"],["Klimmzüge oder Latzug","3 × 6–10","90 Sek.","pull up exercise"],["Kurzhantel-Seitheben","2 × 12–15","60 Sek.","dumbbell lateral raise"]],wod:["8 Dumbbell Thrusters","8 Burpees","Cardio: 150 m Laufband ODER 150 m Rudern ODER 45 Sek. Bowflex Max Total"],cool:"mobility"},
b:{name:"Mittwoch · Hinge & Pull",warm:"3 Min. lockeres Cardio, 10 Glute Bridges, 10 Good Mornings ohne Gewicht, 10 Band Rows; dann RDL-Aufwärmsätze.",main:[["Romanian Deadlift","4 × 6–8","2–3 Min.","barbell romanian deadlift"],["Bulgarian Split Squat","3 × 8 je Bein","90 Sek.","bulgarian split squat"],["Einarmiges Kurzhantelrudern","3 × 8–12 je Arm","90 Sek.","one arm dumbbell row"],["SZ-Curls","2 × 10–15","60 Sek.","ez bar curl"]],wod:["4 Min. Laufband: 30 Sek. schnell / 30 Sek. locker","4 Min. Rudern: 30 Sek. kräftig / 30 Sek. locker","4 Min. Bowflex: 30 Sek. kräftig / 30 Sek. locker"],cool:"mobility"},
c:{name:"Freitag · Full Body",warm:"3 Min. lockeres Cardio, 10 Reverse Lunges, 10 Band Pull-Aparts, 10 leichte Schulterdrückbewegungen; danach Aufwärmsätze.",main:[["Langhantel Overhead Press","4 × 5–8","2–3 Min.","standing barbell overhead press"],["Dumbbell Front Squats","3 × 8–12","90 Sek.","dumbbell front squat"],["Kurzhantel-Schrägbankdrücken","3 × 8–12","90 Sek.","incline dumbbell bench press"],["Latzug oder Klimmzüge","3 × 8–12","90 Sek.","lat pulldown exercise"]],wod:["10 Dumbbell Deadlifts","10 Push-ups","Cardio: 150 m Laufband ODER 150 m Rudern ODER 45 Sek. Bowflex Max Total"],cool:"mobility"}};
const stretches=[["Child’s Pose","60 Sek.","Gesäss zu den Fersen, Arme lang nach vorne.","child pose yoga"],["Cat-Cow","60 Sek.","Im Vierfüsslerstand Rücken langsam runden und strecken.","cat cow stretch"],["World’s Greatest Stretch","30 Sek./Seite","Ausfallschritt und Oberkörper zur vorderen Beinseite öffnen.","worlds greatest stretch"],["Couch Stretch","30 Sek./Seite","Knie gepolstert, Fuss an Bank oder Wand, Hüfte sanft strecken.","couch stretch"],["Hamstring Stretch","30 Sek./Seite","Bein ausstrecken, Hüfte nach hinten, Rücken neutral.","hamstring stretch"],["Figure-4 Stretch","30 Sek./Seite","Auf dem Rücken Knöchel über Knie legen und Bein heranziehen.","figure four glute stretch"],["Butterfly Stretch","60 Sek.","Fusssohlen zusammen, Knie entspannt nach aussen.","butterfly stretch"],["Chest Stretch","30 Sek./Seite","Unterarm an Türrahmen, Oberkörper leicht wegdrehen.","doorway chest stretch"],["Lat Stretch","60 Sek.","Hände auf Bank, Hüfte nach hinten und Brust absenken.","bench lat stretch"],["Spinal Twist","30 Sek./Seite","Auf dem Rücken ein Knie sanft über die Körpermitte führen.","supine spinal twist"]];
function photo(q){return '<a class="photo" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' exercise technique')+'">Fotoanleitung ↗</a>'}
function row(x,i,k){return '<div class="row"><div><strong>'+x[0]+'</strong><div class="small">'+x[1]+' · '+x[2]+'</div>'+photo(x[3])+'</div><input type="checkbox" aria-label="Erledigt" data-key="'+k+i+'"></div>'}
function renderDay(id){let d=workouts[id];return '<h2>'+d.name+'</h2><div class="card"><span class="pill">00–08 Min.</span><h3>Warm-up</h3><p>'+d.warm+'</p></div><div class="card"><span class="pill">08–45 Min.</span><h3>Kraft & Muskelaufbau</h3>'+d.main.map((x,i)=>row(x,i,id)).join('')+'<p class="small">Erste Übung schwer mit langen Pausen; Ergänzungsübungen bei Bedarf im Wechsel. Bei drei Personen Langhantel- und Kurzhantelvarianten parallel nutzen, nicht hektisch rotieren. Sicherheitsablagen beim Bankdrücken verwenden.</p></div><div class="card"><span class="pill">45–57 Min.</span><h3>'+(id==='b'?'Cardio-Intervalle':'12-Minuten-AMRAP')+'</h3>'+d.wod.map(x=>'<div class="row">'+x+'</div>').join('')+'<p class="small">'+(id==='b'?'Alle 4 Minuten gleichzeitig zum nächsten Gerät wechseln; insgesamt 12 Minuten.':'Übungen wiederholen, bis 12 Minuten abgelaufen sind. Bei drei Personen: je 4 Minuten an Laufband, Rudergerät und Bowflex Max Total, dann gleichzeitig rotieren; Wechselzeiten zählen mit. Angefangene Runde beim Wechsel beenden und neue Station starten.')+'</p><div class="timer" id="clock">12:00</div><div style="text-align:center"><button onclick="startTimer()">Start / Pause</button> <button onclick="resetTimer()">Reset</button></div></div><div class="card"><span class="pill">57–67 Min.</span><h3>10 Minuten Mobility</h3><p>Alle zehn Dehnübungen im Tab „Mobility“. Je 60 Sekunden inklusive Seitenwechsel.</p><button onclick="tab('mobility',document.querySelectorAll('nav button')[4])">Mobility öffnen</button></div>'}
function renderMobility(){return '<h2>Cool-down · 10 Minuten</h2><p>Sanft dehnen, ohne Schmerzen und ohne Wippen. 60 Sekunden pro Übung; Seitenwechsel bei 30 Sekunden.</p>'+stretches.map((x,i)=>'<div class="card"><div class="exercise"><div><strong>'+(i+1)+'. '+x[0]+'</strong><div class="small">'+x[1]+'</div><p>'+x[2]+'</p>'+photo(x[3])+'</div><input type="checkbox" data-key="m'+i+'"></div></div>').join('')}
function renderWeeks(){let data=[["1","4 × 6, 3 RIR","Locker"],["2","4 × 6–7, 2 RIR","Moderat"],["3","4 × 6–8, 1–2 RIR","Zügig"],["4","2 × 6, 4+ RIR","6 Min. locker"],["5","4 × 5, 2 RIR","Moderat"],["6","4 × 5–6, 1–2 RIR","Zügig"],["7","4 × 5–6, 1 RIR","Intensiv"],["8","1 Testsatz + 2 leichte Sätze","Benchmark"]];return '<h2>8-Wochen-Progression</h2><p>RIR = verbleibende saubere Wiederholungen. Zuerst Wiederholungen steigern, dann Gewicht erhöhen. In Woche 4 Nebenübungen halbieren. In Woche 8 gleiche WOD-Bedingungen wie in Woche 1 verwenden.</p><div class="card"><table><tr><th>Woche</th><th>Hauptübungen</th><th>Conditioning</th></tr>'+data.map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join('')+'</table></div><p>Für Langhantel-Kniebeugen, RDL und Overhead Press gilt die Progression oben. Bankdrücken und Ergänzungsübungen bleiben im angegebenen Wiederholungsbereich und werden bei sauberer Technik progressiv gesteigert.</p>'}
function renderLog(){return '<h2>Trainingslog</h2><p>Einträge werden lokal auf diesem Gerät gespeichert (nicht zwischen Handys synchronisiert).</p><div class="card"><label>Person <input id="person" placeholder="Name"></label><p>Woche <select id="week">'+Array.from({length:8},(_,i)=>'<option>'+(i+1)+'</option>').join('')+'</select></p>'+["Back Squat","Bankdrücken","Romanian Deadlift","Overhead Press","WOD / Cardio"].map((x,i)=>'<p><label>'+x+'<br><input data-log="'+i+'" placeholder="Gewicht × Wiederholungen / Ergebnis" style="width:100%"></label></p>').join('')+'<button onclick="saveLog()">Eintrag speichern</button><p id="saved"></p></div><div class="card"><h3>Gespeicherte Einträge</h3><pre id="history" style="white-space:pre-wrap;font:13px system-ui"></pre></div>'}
let seconds=720,interval=null,current='a';
function tab(id,btn){clearInterval(interval);interval=null;seconds=720;current=id;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('content').innerHTML=workouts[id]?renderDay(id):id==='mobility'?renderMobility():id==='weeks'?renderWeeks():renderLog();document.querySelectorAll('[data-key]').forEach(x=>{x.checked=localStorage.getItem('check-'+x.dataset.key)==='1';x.onchange=()=>localStorage.setItem('check-'+x.dataset.key,x.checked?'1':'0')});if(id==='log')showHistory()}
function tick(){seconds=Math.max(0,seconds-1);let el=document.getElementById('clock');if(el)el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(!seconds){clearInterval(interval);interval=null}}
function startTimer(){if(interval){clearInterval(interval);interval=null}else interval=setInterval(tick,1000)}
function resetTimer(){clearInterval(interval);interval=null;seconds=720;document.getElementById('clock').textContent='12:00'}
function saveLog(){let p=document.getElementById('person').value.trim()||'Person',w=document.getElementById('week').value,values=[...document.querySelectorAll('[data-log]')].map(x=>x.value);let a=JSON.parse(localStorage.getItem('crossfit-logs')||'[]');a.push({date:new Date().toLocaleDateString('de-CH'),person:p,week:w,values});localStorage.setItem('crossfit-logs',JSON.stringify(a));document.getElementById('saved').textContent='Lokal gespeichert';showHistory()}
function showHistory(){let el=document.getElementById('history');if(el)el.textContent=JSON.parse(localStorage.getItem('crossfit-logs')||'[]').map(x=>x.date+' · '+x.person+' · Woche '+x.week+'\n'+x.values.join(' | ')).join('\n\n')||'Noch keine Einträge'}
tab('a',document.querySelector('nav button'));
</script></body></html>
