<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Home Strength · Training zu dritt</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f1fa;background:#0d1420}*{box-sizing:border-box}body{margin:0 auto;max-width:900px;padding:18px 14px 80px}h1{font-size:clamp(26px,5vw,38px);margin:5px 0}h2{font-size:22px;margin:12px 0}h3{font-size:17px;margin:8px 0}p{line-height:1.5;color:#c0cfe0}small,.muted{color:#a5b7ca}header{padding:10px 0 20px}nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#0d1420;padding:12px 0;z-index:3}button,input,select{font:inherit;border:1px solid #435c79;border-radius:10px;background:#24344b;color:white;padding:10px}button{cursor:pointer;white-space:nowrap}button.active,.primary{background:#126cbd;border-color:#2988d8}button:focus-visible,input:focus-visible{outline:2px solid #80caff}input[type=number]{width:88px}input[type=text]{width:100%}input[type=checkbox]{accent-color:#33b48b;width:20px;height:20px}.card{border:1px solid #31445c;background:#172335;border-radius:15px;padding:16px;margin:13px 0}.pill{display:inline-block;background:#2d4560;padding:4px 9px;border-radius:7px;font-size:12px}.exercise{border-top:1px solid #34465b;padding:14px 0}.exercise:first-of-type{border-top:0}.exercise-head{display:flex;gap:10px;justify-content:space-between;align-items:start}.exercise-head h3{margin:0}.fields{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}.fields label{font-size:12px;color:#adbed0;display:grid;gap:5px}.sets{display:flex;gap:7px;flex-wrap:wrap}.set{border:1px solid #3c536e;border-radius:9px;padding:8px;display:flex;gap:5px;align-items:center}.set label{display:grid;font-size:11px;color:#adbed0;gap:3px}.set input[type=number]{width:64px;padding:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #34465b}.row:last-child{border-bottom:0}a{color:#8acaff}.timer{font-size:52px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.three>div{background:#263b54;border-radius:10px;padding:12px;text-align:center;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;text-align:left;border-bottom:1px solid #34465b;font-size:13px} .topbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{border-left:3px solid #69b6ef;padding-left:12px}.done{color:#72e0a8}@media(max-width:450px){.topbar{grid-template-columns:1fr}.three{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body>
<header><small>HOME GYM · STRENGTH + BODYWEIGHT</small><h1>Home Strength</h1><p>3 Tage pro Woche · 3 Personen · 8 Wochen · ca. 65–75 Minuten · Zone 2 separat</p><div class="topbar"><label>Aktive Person<select id="person" aria-label="Person auswählen"></select></label><label>Trainingswoche<select id="week" aria-label="Woche auswählen"></select></label></div></header>
<nav><button data-tab="a" class="active">Tag A</button><button data-tab="b">Tag B</button><button data-tab="c">Tag C</button><button data-tab="mob">Cool-down</button><button data-tab="plan">8 Wochen</button><button data-tab="history">Verlauf</button><button data-tab="settings">Personen</button></nav><main id="app"></main>
<script>
"use strict";
const DB="home-strength-v3";
const days={
a:{name:"Tag A · Kniebeuge, Flachbank, Rücken",warm:"2 Runden: 10 Air Squats, 10 Band Pull-Aparts, 8 Hip Hinges, 8 Reverse Lunges gesamt, Armkreisen. Danach 2–3 leichte Aufwärmsätze Kniebeuge und Bankdrücken.",lifts:[
["squat","Langhantel-Kniebeuge",3,"6–8","2–3 Min.","barbell back squat","Rack, Brust stabil, Knie in Richtung Fussspitzen; nicht in Schmerzen hinein trainieren."],
["bench","Langhantel-Flachbankdrücken",4,"5–8","2–3 Min.","barbell flat bench press","Schulterblätter zurück, Füsse stabil, Stange kontrolliert zur Brust. Sicherheitsablagen/Spotter nutzen."],
["pullup","Klimmzüge oder Latzug",3,"6–10","90 Sek.","pull up lat pulldown","Vollen kontrollierten Bewegungsumfang nutzen, kein Schwung."],
["rdldb","Kurzhantel Romanian Deadlift",3,"8–10","90 Sek.","dumbbell romanian deadlift","Hüfte nach hinten, Rücken neutral, Hanteln nah am Körper."],
["row","Einarmiges Kurzhantelrudern",3,"10 je Arm","75 Sek.","one arm dumbbell row","Ellbogen Richtung Hüfte ziehen, Rumpf stabil."],
["plank","Unterarmstütz / Plank",3,"30–45 Sek.","60 Sek.","forearm plank exercise","Rumpf und Gesäss fest, keine Hohlkreuzhaltung."]],fin:["10 Air Squats","8 Push-ups","10 Reverse Lunges gesamt","20 Mountain Climbers gesamt"]},
b:{name:"Tag B · Hinge, Zug, einbeinige Kraft",warm:"2 Runden: 10 Glute Bridges, 10 Hip Hinges, 10 Band Rows, 8 Ausfallschritte. Danach 2 leichte RDL-Sätze.",lifts:[
["rdl","Langhantel Romanian Deadlift",4,"6–8","2–3 Min.","barbell romanian deadlift","Hüfte nach hinten schieben; Gewicht nur so tief wie mit neutralem Rücken möglich."],
["pressdb","Kurzhantel-Schulterdrücken",3,"8–10","90 Sek.","dumbbell shoulder press","Rumpf stabil, Hanteln kontrolliert über Kopf drücken."],
["split","Bulgarian Split Squat",3,"8 je Bein","90 Sek.","bulgarian split squat","Vorderer Fuss stabil; langsam absenken, über den ganzen Fuss drücken."],
["lat","Klimmzüge oder Latzug",3,"6–10","90 Sek.","lat pulldown","Schultern nicht hochziehen, sauber bis zur Brust ziehen."],
["curl","SZ-Curls",3,"10–12","60 Sek.","ez bar curl","Ellbogen ruhig, ohne Schwung arbeiten."],
["deadbug","Dead Bug",3,"10 je Seite","60 Sek.","dead bug core exercise","Unterer Rücken bleibt kontrolliert am Boden."]],fin:["8 leichte Kurzhantel-Deadlifts","10 Sit-ups","12 Step-ups gesamt"]},
c:{name:"Tag C · Full Body & Schrägbank",warm:"2 Runden: 10 Air Squats, 10 Band Pull-Aparts, 8 Reverse Lunges, 10 Schulterkreise. Danach leichte Press-Sätze.",lifts:[
["ohp","Langhantel Overhead Press",4,"5–8","2–3 Min.","standing barbell overhead press","Bauch fest, Stange nahe am Gesicht nach oben führen; nicht ins Hohlkreuz drücken."],
["goblet","Goblet Squat",3,"8–12","90 Sek.","goblet squat dumbbell","Hantel vor der Brust, kontrolliert tief gehen."],
["inclin","Kurzhantel-Schrägbankdrücken",3,"8–12","90 Sek.","incline dumbbell bench press","Bank ca. 20–30 Grad, Hanteln kontrolliert senken."],
["inverted","Inverted Row oder Band Row",3,"8–12","75 Sek.","inverted row exercise","Schulterblätter nach hinten ziehen; Körper möglichst gerade."],
["lunge","Reverse Lunges",3,"8 je Bein","75 Sek.","reverse lunge dumbbell","Rückwärtsschritt, Oberkörper aufrecht, kontrolliert absenken."],
["sideplank","Side Plank",3,"30 Sek. je Seite","60 Sek.","side plank exercise","Hüfte hoch und Körper in einer Linie halten."]],fin:["8 Burpees","12 Kurzhantel-Deadlifts","20 Bicycle Crunches gesamt"]}
};
const mobility=[
["Child’s Pose","60 Sek.","Gesäss zu den Fersen, Arme nach vorne.","child pose yoga"],
["Cat-Cow","60 Sek.","Im Vierfüsslerstand Rücken langsam runden und strecken.","cat cow yoga"],
["World’s Greatest Stretch","30 Sek. je Seite","Ausfallschritt, Brust zur vorderen Seite aufdrehen.","worlds greatest stretch"],
["Couch Stretch","30 Sek. je Seite","Knie polstern, hinteren Fuss auf Bank oder an Wand.","couch stretch"],
["Hamstring Stretch","30 Sek. je Seite","Hüfte nach hinten, gestrecktes Bein sanft dehnen.","hamstring stretch"],
["Figure-4 Stretch","30 Sek. je Seite","Auf dem Rücken Knöchel auf das andere Knie legen.","figure four glute stretch"],
["Butterfly Stretch","60 Sek.","Fusssohlen zusammen, Knie entspannt nach aussen.","butterfly stretch"],
["Chest Stretch","30 Sek. je Seite","Unterarm an Türrahmen, Brust sanft öffnen.","doorway chest stretch"],
["Lat Stretch","60 Sek.","Hände auf Bank, Brust absenken.","bench lat stretch"],
["Spinal Twist","30 Sek. je Seite","Auf dem Rücken Knie sanft über die Mitte führen.","supine spinal twist"]];
function load(){try{const x=JSON.parse(localStorage.getItem(DB)||"null");if(x&&Array.isArray(x.people)&&x.people.length)return x}catch(e){}return{people:["Person 1","Person 2","Person 3"],records:{},results:[]}}
let state=load(),tab="a",person=0,week=1,clock=600,timer=null;
const el=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(DB,JSON.stringify(state))}catch(e){alert("Speichern nicht möglich. Prüfe, ob private Browserdaten blockiert sind.")}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function key(day,id){return person+"|"+week+"|"+day+"|"+id}
function get(day,id){return state.records[key(day,id)]||{}}
function photo(q){return '<a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+" exercise technique")+'">Fotoanleitung ansehen ↗</a>'}
function updateSelectors(){el("person").innerHTML=state.people.map((p,i)=>'<option value="'+i+'">'+escapeHTML(p)+'</option>').join("");el("person").value=person;el("week").innerHTML=Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">Woche '+(i+1)+'</option>').join("");el("week").value=week}
function exercise(day,x){let [id,name,count,reps,rest,query,tip]=x,r=get(day,id);let sets=Array.from({length:count},(_,i)=>{let s=(r.sets||[])[i]||{};return '<div class="set"><strong>'+(i+1)+'.</strong><label>kg<input type="number" inputmode="decimal" min="0" step="0.5" data-ex="'+id+'" data-set="'+i+'" data-field="kg" value="'+escapeHTML(s.kg??"")+'" placeholder="kg"></label><label>Wdh.<input type="number" inputmode="numeric" min="0" step="1" data-ex="'+id+'" data-set="'+i+'" data-field="reps" value="'+escapeHTML(s.reps??"")+'" placeholder="Wdh."></label><label>✓<input type="checkbox" data-ex="'+id+'" data-set="'+i+'" data-field="done" '+(s.done?"checked":"")+'></label></div>'}).join("");return '<div class="exercise"><div class="exercise-head"><div><h3>'+escapeHTML(name)+'</h3><small>'+count+' Sätze × '+reps+' · Pause '+rest+'</small></div><span class="pill">'+count+' Sätze</span></div><p>'+escapeHTML(tip)+'</p><small>'+photo(query)+'</small><div class="sets">'+sets+'</div></div>'}
function dayView(day){let d=days[day];return '<h2>'+d.name+'</h2><p class="notice">Die drei Personen können verschiedene Übungen parallel machen. Bei Kniebeuge und Flachbankdrücken das Rack nacheinander nutzen; schwere Sätze nicht hetzen. Zeitbedarf ca. 65–75 Minuten.</p><div class="card"><span class="pill">8 Min.</span><h3>Warm-up</h3><p>'+d.warm+'</p></div><div class="card"><span class="pill">40–48 Min.</span><h3>Kraft & Muskelaufbau</h3><p>Pro Satz etwa 1–3 Wiederholungen in Reserve lassen. Bei Bedarf Alternativen mit Kurzhanteln nutzen.</p>'+d.lifts.map(x=>exercise(day,x)).join("")+'</div><div class="card"><span class="pill">6 Min.</span><h3>Bodyweight-Finisher · AMRAP</h3><p>So viele technisch saubere Runden wie möglich. Kein zusätzliches Zone-2-Training.</p>'+d.fin.map(x=>'<div class="row">'+escapeHTML(x)+'</div>').join("")+'<div class="timer" id="timer">06:00</div><div style="text-align:center"><button id="start" class="primary">Start / Pause</button> <button id="reset">Reset</button></div><div class="fields"><label>Erreichte Runden<input id="rounds" type="number" min="0" step="1" value="'+escapeHTML(get(day,"fin").rounds??"")+'"></label><label>Zusätzliche Wdh.<input id="extra" type="number" min="0" step="1" value="'+escapeHTML(get(day,"fin").extra??"")+'"></label></div></div><div class="card"><span class="pill">10–12 Min.</span><h3>Mobility / Cool-down</h3><p>Alle 10 Übungen gemeinsam durchführen.</p><button data-go="mob">Cool-down öffnen</button></div>'}
function mobilityView(){return '<h2>Cool-down · 10 Übungen</h2><p>Etwa 10–12 Minuten inklusive Positionswechsel. Ruhig atmen, nicht wippen, keine Schmerzen provozieren.</p>'+mobility.map((x,i)=>'<div class="card"><div class="exercise-head"><div><h3>'+(i+1)+'. '+x[0]+'</h3><small>'+x[1]+'</small><p>'+x[2]+'</p>'+photo(x[3])+'</div><input type="checkbox" data-mob="'+i+'" '+(get("mob","m"+i).done?"checked":"")+'></div></div>').join("")}
function planView(){const w=[["1","Einstieg: 2–3 Wdh. in Reserve"],["2","Wiederholungen leicht erhöhen"],["3","Wenn sauber: Gewicht steigern"],["4","Deload: etwa halbe Satzanzahl, lockerer Finisher"],["5","Gewicht gegenüber Woche 2 leicht erhöhen"],["6","Wiederholungen steigern"],["7","Stärkste saubere Trainingswoche"],["8","Leistung vergleichen, keine Maximalversuche nötig"]];return '<h2>8-Wochen-Plan</h2><div class="card"><table><tr><th>Woche</th><th>Ziel</th></tr>'+w.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join("")+'</table></div><p>Wenn du alle Sätze am oberen Ende des Wiederholungsbereichs sauber schaffst, erhöhe beim nächsten Mal die Langhantel um 2,5–5 kg oder die Kurzhanteln um die kleinste verfügbare Stufe. Bei Kniebeschwerden Tiefe und Gewicht anpassen.</p><div class="card"><h3>Organisation zu dritt</h3><div class="three"><div>Station 1<br><strong>Rack / Langhantel</strong></div><div>Station 2<br><strong>Kurzhanteln / Bank</strong></div><div>Station 3<br><strong>Bodyweight / Zug</strong></div></div><p>Nach abgeschlossenen Sätzen rotieren. Beim Bankdrücken immer mit Sicherheitsablagen oder zuverlässiger Hilfestellung.</p></div>'}
function historyView(){let list=Object.entries(state.records).filter(([k,v])=>k.startsWith(person+"|")&&(v.sets||v.rounds!==undefined));return '<h2>Trainingsverlauf · '+escapeHTML(state.people[person])+'</h2><p>Gespeicherte Einträge auf diesem Gerät. Jede Änderung an Gewichten und Wiederholungen wird automatisch gespeichert.</p><div class="card">'+(list.length?list.map(([k,v])=>{let p=k.split("|"),d=days[p[2]],x=d?.lifts.find(y=>y[0]===p[3]);return '<div class="row"><div><strong>Woche '+p[1]+' · '+(x?escapeHTML(x[1]):"Finisher")+'</strong><br><small>'+escapeHTML(d?.name||"")+'</small><br><small>'+(v.sets||[]).map((s,i)=>(i+1)+": "+(s.kg??"–")+" kg × "+(s.reps??"–")+(s.done?" ✓":"")).join(" · ")+(v.rounds!==undefined?"Runden: "+v.rounds:"")+'</small></div></div>'}).join(""):'Noch keine Einträge.')+'</div><button id="export">Daten als JSON exportieren</button>'}
function settingsView(){return '<h2>Personen verwalten</h2><p>Alle drei Profile sind auf diesem Gerät verfügbar. Namen ändern und speichern.</p><div class="card">'+state.people.map((p,i)=>'<p><label>Person '+(i+1)+'<input type="text" maxlength="40" data-name="'+i+'" value="'+escapeHTML(p)+'"></label></p>').join("")+'<button id="savepeople" class="primary">Namen speichern</button></div><p class="notice">Wichtig: Die Einträge liegen im lokalen Browserspeicher. Andere Handys sehen sie nicht. Browserdaten löschen kann die Einträge entfernen. Über den Verlauf kannst du eine Sicherung exportieren.</p>'}
function show(){clearInterval(timer);timer=null;clock=360;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));el("app").innerHTML=days[tab]?dayView(tab):tab==="mob"?mobilityView():tab==="plan"?planView():tab==="history"?historyView():settingsView()}
function updateClock(){const t=el("timer");if(t)t.textContent=String(Math.floor(clock/60)).padStart(2,"0")+":"+String(clock%60).padStart(2,"0")}
function start(){if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{clock=Math.max(0,clock-1);updateClock();if(!clock){clearInterval(timer);timer=null;alert("Finisher beendet!")}},1000)}
function storeSet(input){let id=input.dataset.ex,i=Number(input.dataset.set),field=input.dataset.field,k=key(tab,id),r=state.records[k]||{sets:[]};while(r.sets.length<=i)r.sets.push({});r.sets[i][field]=field==="done"?input.checked:input.value;state.records[k]=r;persist()}
function storeFin(){let k=key(tab,"fin"),r=state.records[k]||{};r.rounds=el("rounds").value;r.extra=el("extra").value;state.records[k]=r;persist()}
document.querySelector("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;show()}});
el("person").addEventListener("change",e=>{person=Number(e.target.value);show()});
el("week").addEventListener("change",e=>{week=Number(e.target.value);show()});
el("app").addEventListener("input",e=>{if(e.target.matches("[data-ex]"))storeSet(e.target);if(e.target.id==="rounds"||e.target.id==="extra")storeFin()});
el("app").addEventListener("change",e=>{if(e.target.matches("[data-ex]"))storeSet(e.target);if(e.target.matches("[data-mob]")){state.records[key("mob","m"+e.target.dataset.mob)]={done:e.target.checked};persist()}});
el("app").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.id==="start")start();if(b.id==="reset"){clearInterval(timer);timer=null;clock=360;updateClock()}if(b.dataset.go){tab=b.dataset.go;show()}if(b.id==="savepeople"){document.querySelectorAll("[data-name]").forEach(x=>state.people[Number(x.dataset.name)]=x.value.trim()||"Person "+(Number(x.dataset.name)+1));persist();updateSelectors();show()}if(b.id==="export"){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download="home-strength-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
updateSelectors();show();
</script></body></html>
